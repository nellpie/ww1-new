<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1008" />
  <title>WWI Harita</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=IM+Fell+English&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0b06;
      --parchment: #c9a96e;
      --parchment-dark: #8b6914;
      --red: #8b1a1a;
      --cream: #f0e6cc;
      --ui-bg: rgba(14, 11, 6, 0.82);
      --border: rgba(201, 169, 110, 0.35);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Cinzel', serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── MAP CONTAINER ── */
    #map-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
    }
    #map-wrap.grabbing { cursor: grabbing; }

    #map-canvas {
      position: absolute;
      top: 0; left: 0;
      display: block;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    /* ── VIGNETTE ── */
    #vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* ── TOP BAR ── */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: none;
    }

    #title-text {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--parchment);
      text-transform: uppercase;
      opacity: 0.7;
      text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }

    /* ── BOTTOM CONTROLS ── */
    #controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 0 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 20;
      pointer-events: none;
    }

    /* Map type toggle */
    #type-toggle {
      pointer-events: all;
      background: var(--ui-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: border-color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    #type-toggle:active { background: rgba(201,169,110,0.15); }

    #type-icon {
      width: 18px; height: 18px;
      opacity: 0.85;
    }

    #type-label {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--parchment);
      text-transform: uppercase;
    }

    /* Year navigator */
    #year-nav {
      pointer-events: all;
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--ui-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .year-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #4fc3f7;
      font-size: 18px;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
      border: none;
      background: transparent;
      font-family: 'Cinzel', serif;
    }
    .year-btn:active { background: rgba(79,195,247,0.12); }
    .year-btn:disabled { color: rgba(79,195,247,0.25); cursor: default; }

    #year-sep-l, #year-sep-r {
      width: 1px; height: 24px;
      background: var(--border);
      flex-shrink: 0;
    }

    #year-display {
      width: 72px;
      text-align: center;
      font-family: 'IM Fell English', serif;
      font-size: 22px;
      color: var(--cream);
      letter-spacing: 0.04em;
      line-height: 44px;
    }

    /* ── LOADING OVERLAY ── */
    #loader {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      z-index: 100;
      transition: opacity 0.35s;
    }
    #loader.hiding { opacity: 0; pointer-events: none; }
    #loader.hidden { display: none; }

    #loader-title {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      letter-spacing: 0.3em;
      color: var(--parchment);
      text-transform: uppercase;
    }

    #loader-bar-wrap {
      width: 140px; height: 2px;
      background: rgba(201,169,110,0.2);
      border-radius: 2px;
      overflow: hidden;
    }
    #loader-bar {
      height: 100%;
      width: 0%;
      background: var(--parchment);
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* ── MAP CROSSFADE ── */
    #map-canvas { transition: opacity 0.25s; }
    #map-canvas.fading { opacity: 0; }

    /* ── LIST PANEL ── */
    #list-panel {
      position: fixed;
      bottom: 120px;
      left: 20px;
      width: 280px;
      max-height: 400px;
      background: var(--ui-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: none;
      flex-direction: column;
      z-index: 25;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    #list-panel.open { display: flex; }

    #list-search {
      padding: 10px;
      background: rgba(0,0,0,0.2);
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--cream);
      font-family: 'Cinzel', serif;
      font-size: 11px;
      border-radius: 8px 8px 0 0;
    }
    #list-search::placeholder { color: #8b7355; }
    #list-search:focus { outline: none; border-bottom-color: var(--parchment); }

    #list-countries {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .list-item {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }
    .list-item:hover { background: rgba(201,169,110,0.1); }

    .list-flag {
      width: 32px;
      height: 21px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .list-flag img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .list-name {
      font-size: 11px;
      color: var(--cream);
      flex: 1;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    #list-toggle {
      position: fixed;
      bottom: 28px;
      left: 20px;
      width: 44px;
      height: 44px;
      background: var(--ui-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 24;
      pointer-events: all;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }
    #list-toggle:active { background: rgba(201,169,110,0.15); }

    /* ── INFO POPUP ── */
    #info-overlay {
      display: none;
    }
    #info-overlay.open {
      display: block;
    }

    #info-popup {
      position: fixed;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%) translateY(18px);
      background: var(--ui-bg);
      border: 2px solid var(--parchment);
      border-radius: 8px;
      padding: 20px;
      width: 95%;
      max-width: 800px;
      max-height: 280px;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.3, 0.64, 1);
    }
    #info-popup.show {
      opacity: 1;
      pointer-events: all;
      transform: translateX(-50%) translateY(0);
    }

    .info-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .info-flag {
      width: 50px;
      height: 33px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .info-flag img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info-title {
      font-size: 16px;
      color: var(--cream);
      font-weight: 600;
      letter-spacing: 0.05em;
      font-family: 'Cinzel', serif;
      cursor: pointer;
      transition: color 0.2s;
      flex: 1;
    }
    .info-title:hover { color: var(--parchment); }

    .info-content {
      color: #c9a96e;
      font-size: 12px;
      line-height: 1.5;
      font-family: 'Times New Roman', serif;
    }

    .info-close {
      position: absolute;
      top: 8px;
      right: 8px;
      background: none;
      border: none;
      color: var(--parchment);
      font-size: 20px;
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 768px) {
      #list-panel { width: 240px; }
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loader">
  <div id="loader-title">WWI · 1914–1918</div>
  <div id="loader-bar-wrap"><div id="loader-bar"></div></div>
</div>

<!-- Vignette -->
<div id="vignette"></div>

<!-- Map -->
<div id="map-wrap">
  <canvas id="map-canvas"></canvas>
</div>

<!-- Top bar -->
<div id="top-bar">
  <span id="title-text">Birinci Dünya Savaşı</span>
</div>

<!-- Bottom controls -->
<div id="controls">
  <div id="type-toggle" role="button" aria-label="Harita türünü değiştir">
    <svg id="type-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" style="color:var(--parchment)">
      <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"/>
      <line x1="9" y1="3" x2="9" y2="18"/>
      <line x1="15" y1="6" x2="15" y2="21"/>
    </svg>
    <span id="type-label">Ülke Sınırları</span>
  </div>

  <div id="year-nav">
    <button class="year-btn" id="btn-prev" aria-label="Önceki yıl">&#8249;</button>
    <div id="year-sep-l"></div>
    <div id="year-display">1914</div>
    <div id="year-sep-r"></div>
    <button class="year-btn" id="btn-next" aria-label="Sonraki yıl">&#8250;</button>
  </div>
</div>

<!-- List Toggle Button -->
<button id="list-toggle">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:20px;height:20px;color:var(--parchment)">
    <line x1="8" y1="6" x2="21" y2="6"></line>
    <line x1="8" y1="12" x2="21" y2="12"></line>
    <line x1="8" y1="18" x2="21" y2="18"></line>
  </svg>
</button>

<!-- List Panel -->
<div id="list-panel">
  <input id="list-search" type="text" placeholder="Ülke ara...">
  <div id="list-countries"></div>
</div>

<!-- Info Overlay -->
<div id="info-overlay" onclick="closeInfo()"></div>

<!-- Info Popup -->
<div id="info-popup">
  <button class="info-close" onclick="closeInfo()">×</button>
  <div class="info-header">
    <div class="info-flag"><img id="info-flag" src="" alt="flag"></div>
    <h2 class="info-title" id="info-title" onclick="openWikipedia()">Ülke Adı</h2>
  </div>
  <div class="info-content" id="info-content">Bilgi yükleniyor...</div>
</div>

<script>
  // ── COUNTRIES DATA ──────────────────────────────────────────────────────────
  const COUNTRIES = [
    {

    },
    {
      name: 'Fransa',
      flag: './flags/fransa.png',
      coords: { x: 2748, y: 2050 },
      wiki: 'https://tr.wikipedia.org/wiki/Birinci_Dünya_Savaşında_Fransa',
      info: 'Fransa, savaşın başından itibaren İtilaf Devletleri’nin önemli bir üyesiydi ve özellikle Batı Cephesi’nde Almanya’ya karşı yoğun savunma ve karşı saldırılar gerçekleştirdi. Verdun gibi büyük muharebelerde ağır kayıplar verdi ancak direnişini sürdürdü. Savaş boyunca İngiltere ve daha sonra ABD ile birlikte hareket ederek Almanya’yı yıprattı.'
    },
    {
      name: 'Belçika',
      flag: './flags/belcika.png',
      coords: { x: 2860, y: 1735 },
      wiki: 'https://tr.wikipedia.org/wiki/Birinci_Dünya_Savaşında_Belçika',
      info: 'Belçika, savaşın başında tarafsız olmasına rağmen Almanya’nın Fransa’ya ulaşmak için ülkesini işgal etmesiyle savaşa dahil oldu. Belçika’nın direnişi Almanya’nın ilerlemesini yavaşlattı ve bu durum savaşın uzamasına katkı sağladı. Ülke büyük ölçüde işgal altında kaldı ve ciddi yıkıma uğradı.'
    },
    {
      name: 'Romanya',
      flag: './flags/romanya.png',
      coords: { x: 4179, y: 2196 },
      wiki: 'https://tr.wikipedia.org/wiki/Birinci_Dünya_Savaşında_Romanya',
      info: 'Romanya, 1916’da İtilaf Devletleri safında savaşa katıldı ve Avusturya-Macaristan’a karşı saldırıya geçti. Ancak kısa sürede Alman ve müttefik kuvvetler tarafından geri püskürtüldü ve ülkenin büyük kısmı işgal edildi. Savaşın sonlarına doğru tekrar toparlanarak İtilaf Devletleri’nin zaferine katkı sağladı.'
    },
    {
      name: 'Sırbistan',
      flag: './flags/sirbistan.png',
      coords: { x: 3864, y: 2351 },
      wiki: 'https://tr.wikipedia.org/wiki/Birinci_Dünya_Savaşında_Sırbistan',
      info: 'Sırbistan, savaşın çıkışında merkezi rol oynadı; Avusturya-Macaristan’ın veliahtının suikast sonucu öldürülmesi üzerine savaşın fitili ateşlendi. Sırbistan, Avusturya-Macaristan’a karşı direndi ancak daha sonra Almanya ve Bulgaristan’ın saldırılarıyla büyük kayıplar vererek geri çekilmek zorunda kaldı. Buna rağmen savaş boyunca İtilaf Devletleri’nin bir parçası olarak mücadele etti.'
    },
    {
      name: 'Rus İmparatorluğu',
      flag: './flags/rusya.png',
      coords: { x: 4839, y: 1593 },
      wiki: 'https://tr.wikipedia.org/wiki/Birinci_Dünya_Savaşında_Rusya',
      info: 'Rus İmparatorluğu, savaşın başında İtilaf Devletleri safında yer aldı ve Doğu Cephesi’nde Almanya ve Avusturya-Macaristan’a karşı savaştı. Başlangıçta bazı başarılar elde etse de ağır kayıplar ve ekonomik zorluklar nedeniyle iç karışıklıklar yaşadı. 1917’deki Bolşevik Devrimi sonrasında savaştan çekildi.'
    },
    {
      name: 'Osmanlı İmparatorluğu',
      flag: './flags/turkiye.png',
      coords: { x: 4664, y: 2645 },
      wiki: 'https://tr.wikipedia.org/wiki/Birinci_Dünya_Savaşında_Osmanlı_İmparatorluğu',
      info: 'Osmanlı İmparatorluğu, İttifak Devletleri safında savaşa katıldı ve birçok cephede mücadele etti. Çanakkale Cephesi’nde İtilaf Devletleri’ni durdurdu, Kafkasya’da Rusya’ya karşı savaştı ve Orta Doğu’da İngiliz kuvvetleriyle çatıştı. Savaş sonunda topraklarının büyük kısmını kaybetti.'
    },
    {
      name: 'Avusturya-Macaristan İmparatorluğu',
      flag: './flags/avusturya.png',
      coords: { x: 3751, y: 1993 },
      wiki: 'https://tr.wikipedia.org/wiki/Birinci_Dünya_Savaşında_Avusturya-Macaristan',
      info: 'Avusturya-Macaristan İmparatorluğu, savaşın başlamasına doğrudan neden olan devlet olarak Sırbistan’a savaş ilan etti. Çok uluslu yapısı nedeniyle iç sorunlar yaşadı ve çeşitli cephelerde zorlandı. Almanya’nın desteğine rağmen savaş sonunda dağılmaya başladı.'
    },
    {
      name: 'Birleşik Krallık',
      flag: './flags/ingiltere.png',
      coords: { x: 2341, y: 1502 },
      wiki: 'https://tr.wikipedia.org/wiki/Birinci_Dünya_Savaşında_İngiltere',
      info: 'Birleşik Krallık, İtilaf Devletleri’nin en güçlü üyelerinden biri olarak Almanya’ya karşı hem karada hem denizde mücadele etti. Donanmasıyla deniz üstünlüğünü sağladı ve Almanya’ya ekonomik abluka uyguladı. Aynı zamanda sömürgelerinden asker toplayarak savaş gücünü artırdı.'
    },
    {
      name: 'Senusiler',
      flag: './flags/senusiler.png',
      coords: { x: 3878, y: 3831 },
      wiki: 'https://tr.wikipedia.org/wiki/Senusiyye',
      info: 'Senusiler, Kuzey Afrika’da Osmanlı ve Almanya ile iş birliği yaparak İngilizlere karşı mücadele etti. Özellikle Mısır ve Libya çevresinde İngiliz kuvvetlerine saldırılar düzenlediler. Bu faaliyetler, İngilizlerin bölgedeki askeri kaynaklarını bölmesine neden oldu.'
    },
    {
      name: 'İran',
      flag: './flags/iran.png',
      coords: { x: 5899, y: 3151 },
      wiki: 'https://tr.wikipedia.org/wiki/Birinci_Dünya_Savaşında_İran',
      info: 'İran, savaş sırasında resmen tarafsız olmasına rağmen toprakları Rus, İngiliz ve Osmanlı kuvvetleri tarafından işgal edildi. Bu durum ülkenin iç istikrarını bozdu ve savaşın dolaylı etkilerini yoğun şekilde yaşamasına neden oldu.'
    }
  ];

  // ── CONFIG ──────────────────────────────────────────────────────────────────
  const YEARS = [1914, 1915, 1916, 1917, 1918];
  const TYPES = ['country', 'alliance'];
  const TYPE_LABELS = { country: 'Ülke Sınırları', alliance: 'İttifak Haritası' };
  const MAP_DIR = './maps/';

  // ── STATE ───────────────────────────────────────────────────────────────────
  let yearIdx = 0;
  let typeIdx = 0;

  // Pan / zoom state
  let scale = 1;
  let ox = 0, oy = 0;
  let imgW = 0, imgH = 0;
  let minScale = 1;

  // Canvas render loop
  const canvas = document.getElementById('map-canvas');
  const ctx    = canvas.getContext('2d');
  const wrap   = document.getElementById('map-wrap');
  const yearEl      = document.getElementById('year-display');
  const typeLabel   = document.getElementById('type-label');
  const btnPrev     = document.getElementById('btn-prev');
  const btnNext     = document.getElementById('btn-next');
  const loader      = document.getElementById('loader');

  let currentImage  = null;  // loaded HTMLImageElement
  let nextImage     = null;  // being loaded
  let rafId         = null;
  let dirty         = true;  // needs redraw

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vw = window.innerWidth, vh = window.innerHeight;
    canvas.width  = vw * dpr;
    canvas.height = vh * dpr;
    canvas.style.width  = vw + 'px';
    canvas.style.height = vh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dirty = true;
  }

  function draw() {
    if (!dirty || !currentImage) return;
    dirty = false;
    const vw = window.innerWidth, vh = window.innerHeight;
    ctx.clearRect(0, 0, vw, vh);
    ctx.drawImage(currentImage, ox, oy, imgW * scale, imgH * scale);
  }

  function renderLoop() {
    draw();
    rafId = requestAnimationFrame(renderLoop);
  }

  // ── HELPERS ─────────────────────────────────────────────────────────────────
  function mapSrc(year, type) {
    return `${MAP_DIR}${year}_${type}.jpg`;
  }

  function clampOffset(x, y, s) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const iw = imgW * s, ih = imgH * s;
    const minX = iw > vw ? vw - iw : (vw - iw) / 2;
    const minY = ih > vh ? vh - ih : (vh - ih) / 2;
    const maxX = iw > vw ? 0 : (vw - iw) / 2;
    const maxY = ih > vh ? 0 : (vh - ih) / 2;
    return {
      x: Math.min(maxX, Math.max(minX, x)),
      y: Math.min(maxY, Math.max(minY, y))
    };
  }

  function applyTransform(x, y, s) {
    const c = clampOffset(x, y, s);
    ox = c.x; oy = c.y; scale = s;
    dirty = true;
  }

  function fitToScreen() {
    if (!imgW || !imgH) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.max(vw / imgW, vh / imgH);
    minScale = s;
    applyTransform((vw - imgW * s) / 2, (vh - imgH * s) / 2, s);
  }

  // ── IMAGE LOAD ───────────────────────────────────────────────────────────────
  function showMap(year, type, animate) {
    const src = mapSrc(year, type);
    if (animate) canvas.classList.add('fading');

    const img = new Image();
    nextImage = img;
    img.onload = () => {
      if (img !== nextImage) return; // superseded
      if (!imgW) {
        imgW = img.naturalWidth;
        imgH = img.naturalHeight;
        fitToScreen();
      }
      currentImage = img;
      dirty = true;
      if (animate) {
        setTimeout(() => canvas.classList.remove('fading'), 20);
      }
    };
    img.src = src;
  }

  function updateUI() {
    const year = YEARS[yearIdx];
    const type = TYPES[typeIdx];
    yearEl.textContent = year;
    typeLabel.textContent = TYPE_LABELS[type];
    btnPrev.disabled = yearIdx === 0;
    btnNext.disabled = yearIdx === YEARS.length - 1;
    showMap(year, type, true);
  }

  // ── YEAR NAV ─────────────────────────────────────────────────────────────────
  btnPrev.addEventListener('click', () => {
    if (yearIdx > 0) { yearIdx--; updateUI(); }
  });
  btnNext.addEventListener('click', () => {
    if (yearIdx < YEARS.length - 1) { yearIdx++; updateUI(); }
  });
  document.getElementById('type-toggle').addEventListener('click', () => {
    typeIdx = (typeIdx + 1) % TYPES.length;
    updateUI();
  });

  // ── TOUCH: PAN & PINCH ───────────────────────────────────────────────────────
  let lastTouches = null;
  let panStart    = null;
  let isPinching  = false;

  function getTouchMidpoint(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }
  function getTouchDist(t1, t2) {
    return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
  }

  wrap.addEventListener('touchstart', e => {
    e.preventDefault();
    lastTouches = Array.from(e.touches);
    if (e.touches.length === 1) {
      isPinching = false;
      panStart = { ox, oy, cx: e.touches[0].clientX, cy: e.touches[0].clientY };
    } else if (e.touches.length === 2) {
      isPinching = true;
      panStart = null;
    }
    wrap.classList.add('grabbing');
  }, { passive: false });

  wrap.addEventListener('touchmove', e => {
    e.preventDefault();
    const touches = Array.from(e.touches);

    if (touches.length === 1 && panStart && !isPinching) {
      applyTransform(
        panStart.ox + touches[0].clientX - panStart.cx,
        panStart.oy + touches[0].clientY - panStart.cy,
        scale
      );
    } else if (touches.length === 2 && lastTouches.length >= 2) {
      isPinching = true;
      const prevMid  = getTouchMidpoint(lastTouches[0], lastTouches[1]);
      const mid      = getTouchMidpoint(touches[0], touches[1]);
      const factor   = getTouchDist(touches[0], touches[1]) / getTouchDist(lastTouches[0], lastTouches[1]);
      const newScale = Math.min(Math.max(scale * factor, minScale), minScale * 12);
      applyTransform(
        mid.x - (mid.x - ox) * (newScale / scale) + (mid.x - prevMid.x),
        mid.y - (mid.y - oy) * (newScale / scale) + (mid.y - prevMid.y),
        newScale
      );
    }

    lastTouches = touches;
  }, { passive: false });

  wrap.addEventListener('touchend', e => {
    e.preventDefault();
    lastTouches = Array.from(e.touches);
    if (e.touches.length === 0) {
      wrap.classList.remove('grabbing');
      panStart = null;
      isPinching = false;
    } else if (e.touches.length === 1) {
      isPinching = false;
      panStart = { ox, oy, cx: e.touches[0].clientX, cy: e.touches[0].clientY };
    }
  }, { passive: false });

  // ── MOUSE: PAN & WHEEL ZOOM ──────────────────────────────────────────────────
  let mouseDown = false, mStart = null;

  wrap.addEventListener('mousedown', e => {
    mouseDown = true;
    mStart = { ox, oy, cx: e.clientX, cy: e.clientY };
    wrap.classList.add('grabbing');
  });
  window.addEventListener('mousemove', e => {
    if (!mouseDown || !mStart) return;
    applyTransform(mStart.ox + e.clientX - mStart.cx, mStart.oy + e.clientY - mStart.cy, scale);
  });
  window.addEventListener('mouseup', () => { mouseDown = false; wrap.classList.remove('grabbing'); });

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const factor   = e.deltaY < 0 ? 1.12 : 0.89;
    const newScale = Math.min(Math.max(scale * factor, minScale), minScale * 12);
    applyTransform(
      e.clientX - (e.clientX - ox) * (newScale / scale),
      e.clientY - (e.clientY - oy) * (newScale / scale),
      newScale
    );
  }, { passive: false });

  // ── DOUBLE-TAP TO RESET ──────────────────────────────────────────────────────
  let lastTap = 0;
  wrap.addEventListener('touchend', e => {
    if (isPinching || e.touches.length > 0) return;
    const now = Date.now();
    if (now - lastTap < 300) animateTo(
      (window.innerWidth  - imgW * minScale) / 2,
      (window.innerHeight - imgH * minScale) / 2,
      minScale, 500
    );
    lastTap = now;
  });

  // ── RESIZE ───────────────────────────────────────────────────────────────────
  window.addEventListener('resize', () => {
    resizeCanvas();
    if (!imgW || !imgH) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.max(vw / imgW, vh / imgH);
    minScale = s;
    applyTransform(ox, oy, Math.max(scale, minScale));
  });

  // ── LIST & INFO FUNCTIONS ────────────────────────────────────────────────────
  let selectedCountry = null;

  function initList() {
    const listToggle    = document.getElementById('list-toggle');
    const listPanel     = document.getElementById('list-panel');
    const listSearch    = document.getElementById('list-search');
    const listCountries = document.getElementById('list-countries');

    listToggle.addEventListener('click', () => listPanel.classList.toggle('open'));

    function renderCountries(filter = '') {
      listCountries.innerHTML = '';
      COUNTRIES.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()))
        .forEach(country => {
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML = `
            <div class="list-flag"><img src="${country.flag}" alt="${country.name}"></div>
            <div class="list-name">${country.name}</div>
          `;
          item.addEventListener('click', () => {
            selectCountry(country);
            listPanel.classList.remove('open');
          });
          listCountries.appendChild(item);
        });
    }

    listSearch.addEventListener('input', e => renderCountries(e.target.value));
    renderCountries();
  }

  // ── ANIMATE TO ───────────────────────────────────────────────────────────────
  function animateTo(targetX, targetY, targetScale, duration, onDone) {
    const startX = ox, startY = oy, startScale = scale;
    const startTime = performance.now();
    function ease(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
    function step(now) {
      const t = Math.min((now - startTime) / duration, 1);
      applyTransform(
        startX + (targetX - startX) * ease(t),
        startY + (targetY - startY) * ease(t),
        startScale + (targetScale - startScale) * ease(t)
      );
      if (t < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  function selectCountry(country) {
    selectedCountry = country;
    const newScale = Math.min(minScale * 4, 3);
    animateTo(
      window.innerWidth  / 2 - country.coords.x * newScale,
      window.innerHeight / 2 - country.coords.y * newScale,
      newScale, 900, () => showInfo(country)
    );
  }

  function showInfo(country) {
    const popup = document.getElementById('info-popup');
    document.getElementById('info-title').textContent   = country.name;
    document.getElementById('info-flag').src            = country.flag;
    document.getElementById('info-content').textContent = country.info;
    popup.classList.add('show');
    window.currentCountryWiki = country.wiki;
  }

  function openWikipedia() {
    if (window.currentCountryWiki) window.open(window.currentCountryWiki, '_blank');
  }

  function closeInfo() {
    document.getElementById('info-popup').classList.remove('show');
  }

  initList();

  // ── INIT ─────────────────────────────────────────────────────────────────────
  resizeCanvas();
  renderLoop();

  // Labels/buttons
  yearEl.textContent  = YEARS[yearIdx];
  typeLabel.textContent = TYPE_LABELS[TYPES[typeIdx]];
  btnPrev.disabled = true;
  btnNext.disabled = false;

  function hideLoader() {
    if (loader.classList.contains('hidden')) return;
    loader.classList.add('hiding');
    setTimeout(() => loader.classList.add('hidden'), 380);
  }

  // Failsafe: always hide after 5s no matter what
  setTimeout(hideLoader, 5000);

  function loadFirstMap() {
    const src = mapSrc(YEARS[0], TYPES[0]);
    const img = new Image();

    const done = () => {
      if (img.naturalWidth) {
        imgW = img.naturalWidth;
        imgH = img.naturalHeight;
        fitToScreen();
        currentImage = img;
        dirty = true;
      }
      hideLoader();
      // Preload others after first paint
      requestAnimationFrame(() => {
        YEARS.forEach(y => TYPES.forEach(t => {
          if (!(y === YEARS[0] && t === TYPES[0])) {
            const i = new Image(); i.src = mapSrc(y, t);
          }
        }));
      });
    };

    img.onload  = done;
    img.onerror = done; // hide loader even if maps folder is missing
    img.src = src;

    // If cached, onload may already have fired before assignment on some browsers
    if (img.complete && img.naturalWidth) done();
  }

  loadFirstMap();
</script>
</body>
</html>
